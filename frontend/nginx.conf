server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Контейнер стоит за внешним nginx с HTTPS. Абсолютные редиректы строились
    # бы на http:// и порт контейнера, поэтому отдаём только относительные.
    absolute_redirect off;

    # Проксируем /api на бэкенд.
    # CORS здесь не выставляем: сайт и API на одном домене, а для остальных
    # origin список разрешённых задаёт сам бэкенд (FRONTEND_URL).
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Языковые версии (/ru, /de, ...) пререндерены в /ru/index.html и т.д.
    # $uri/index.html отдаёт их сразу с кодом 200, без редиректа на /ru/.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
